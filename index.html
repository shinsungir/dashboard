<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신성대학교 공시 종합 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.initGsi&&initGsi()"></script>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#1b2333; --ink2:#4b5563; --ink3:#8a93a3; --line:#e3e6ee; --navy:#1a2744;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#17824a; --bad:#c23a2e; --neu:#6b7280; --warnbg:#fff7e0; --warn:#8a5a00;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,select,input{font-family:inherit;font-size:14px}

/* 헤더 */
.hd{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hd-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-size:12px;color:#aab6d3;font-weight:400}
.yr{display:flex;align-items:center;gap:8px;font-size:13px;color:#c9d3ea}
.yr select{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:7px 12px;font-weight:600}
.tabs{max-width:1320px;margin:0 auto;padding:0 24px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:#c9d3ea;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:600}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.on{background:#fff;color:var(--navy)}
.tab[hidden]{display:none}

/* 본문 */
main{max-width:1320px;margin:0 auto;padding:24px 24px 40px}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.info{background:#e8f0fe;color:#1d3f87}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.err{background:#fde8e6;color:#8d241b}
.banner button{margin-left:auto}
h2.sec{font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec small{font-weight:400;color:var(--ink3);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px 14px;border:1px solid var(--line);border-left:6px solid var(--c,var(--s1))}
.kpi .l{font-size:13.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:30px;font-weight:700;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v .u{font-size:14px;font-weight:600;color:var(--ink3);margin-left:3px}
.kpi .v.na{font-size:17px;color:var(--ink3);font-weight:600}
.kpi .d{font-size:13px;margin-top:8px;font-weight:600;color:var(--neu)}
.kpi .d.good{color:var(--good)}.kpi .d.bad{color:var(--bad)}
.kpi .n{font-size:11.5px;color:var(--ink3);margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:18px 20px}
.card.wide{grid-column:1/-1}
.card h3{font-size:15.5px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--ink3);margin:2px 0 10px}
.cv{position:relative;height:300px}.cv.tall{height:420px}.cv.short{height:240px}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px;background:repeating-linear-gradient(135deg,#fafbfc,#fafbfc 8px,#f3f4f7 8px,#f3f4f7 16px);border-radius:10px;text-align:center;padding:12px}
.tw{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{background:#f0f2f7;color:var(--ink2);font-weight:700;padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:#fff;font-weight:600}
tr.sel td{background:#eef4ff}tr.sel td:first-child{background:#eef4ff}
td.na{color:#b4bac6}
.sub-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.sub-tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink2)}
.sub-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip.on{background:#e8f0fe;border-color:#9db9ee;color:#1d3f87;font-weight:600}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ctl label{font-size:13px;color:var(--ink2);font-weight:600}
.ctl select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.rk-good{color:var(--good);font-weight:700}.rk-bad{color:var(--bad);font-weight:700}
.btn{border:0;background:var(--s1);color:#fff;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(.94)}.btn:disabled{background:#b7bdca;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.drop{border:2px dashed #b7c2dc;border-radius:14px;padding:30px;text-align:center;color:var(--ink2);background:#fafbff;cursor:pointer}
.drop.over{background:#e8f0fe;border-color:var(--s1)}
.drop b{font-size:16px;color:var(--ink)}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.st.ok{background:#e1f5ea;color:#116237}.st.warn{background:var(--warnbg);color:var(--warn)}.st.bad{background:#fde8e6;color:#8d241b}.st.skip{background:#eceef3;color:#5b6475}
.msg{font-size:12.5px;color:var(--ink2);white-space:normal;text-align:left;max-width:640px;line-height:1.45}
.msg.e{color:var(--bad)}.msg.w{color:var(--warn)}
.steps{counter-reset:s;list-style:none;display:grid;gap:8px;font-size:14px}
.steps li{counter-increment:s;padding-left:34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fm label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fm input,.fm select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--ink2)}
footer{max-width:1320px;margin:0 auto;padding:6px 24px 36px;color:var(--ink3);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--ink3)}
.leg-note{font-size:12.5px;color:var(--ink3);margin-top:8px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}main{padding:16px 14px 32px}.hd-in,.tabs{padding-left:14px;padding-right:14px}.kpi .v{font-size:26px}}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   CORE: 대학알리미 엑셀 파서 + 지표 해석기 (브라우저/Node 공용)
   - 헤더 문구(경로) 기반으로 열을 찾으므로 열 순서가 바뀌어도 동작
   - 지표(catalog)의 patterns 문법은 make_catalog.py 상단 주석 참고
   ═══════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  const DIM_LABELS = ['졸업연도', '학기', '정원구분', '전형명'];   // 연도 외에 행을 구분하는 열(헤더 문구 기준)
  const SCHOOL_LABELS = ['학교', '학교명'];
  const SCHOOL_SHEET_MARK = '생성된IR코드';

  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[\s 　]+/g, '')
      .replace(/[∙•ㆍ・]/g, '·')
      .replace(/[‘’`´′]/g, "'");
  }

  function toNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    const s = String(v).replace(/,/g, '').trim();
    if (s === '' || s === '-' || s === '–') return null;
    return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;   // NaN = 숫자가 아닌 문자
  }

  /* ── 패턴 해석 ── */
  function parsePart(part) {
    let p = part.trim(), optional = false;
    if (p[0] === '?') { optional = true; p = p.slice(1); }
    const i = p.indexOf('::');
    return { optional, sheet: p.slice(0, i), path: norm(p.slice(i + 2)), raw: p };
  }
  function matchPaths(paths, pat) {
    if (pat.indexOf('*') >= 0) {
      const re = new RegExp('^' + pat.split('*').map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$');
      return { idx: paths.map((p, i) => re.test(p) ? i : -1).filter(i => i >= 0), ambiguous: false };
    }
    const ex = paths.map((p, i) => p === pat ? i : -1).filter(i => i >= 0);
    if (ex.length) return { idx: ex.slice(0, 1), ambiguous: false };
    const pre = paths.map((p, i) => p.startsWith(pat) ? i : -1).filter(i => i >= 0);
    if (pre.length > 1) return { idx: [], ambiguous: true };
    return { idx: pre, ambiguous: false };
  }

  /* ── 시트 파싱 ── */
  function parseSheet(name, aoa, merges, opts) {
    opts = opts || {};
    const res = { name, ok: true, errors: [], warnings: [], years: [], cols: [], rows: [], nFacts: 0 };
    const yearRe = /^\s*(20\d\d)/;
    const first = aoa.findIndex(r => r && r[0] != null && yearRe.test(String(r[0])));
    if (first < 0) { res.ok = false; res.errors.push('데이터 행(기준연도 열이 20xx로 시작하는 행)을 찾지 못했습니다.'); return res; }

    const width = Math.max(...aoa.map(r => (r ? r.length : 0)));
    const grid = [];
    for (let r = 0; r < first; r++) {
      const row = [];
      for (let c = 0; c < width; c++) row.push(norm(aoa[r] ? aoa[r][c] : ''));
      grid.push(row);
    }
    (merges || []).forEach(m => {
      if (m.s.r >= first) return;
      const v = norm(aoa[m.s.r] ? aoa[m.s.r][m.s.c] : '');
      for (let r = m.s.r; r <= Math.min(m.e.r, first - 1); r++)
        for (let c = m.s.c; c <= m.e.c; c++) if (c < width) grid[r][c] = v;
    });

    // 학교 열 / 구분(dim) 열 / 측정 열
    let schoolCol = 5;
    for (let c = 0; c < Math.min(width, 10); c++) {
      if (grid.some(row => SCHOOL_LABELS.includes(row[c]))) { schoolCol = c; break; }
    }
    const path = [];
    for (let c = 0; c < width; c++) {
      const labels = [];
      grid.forEach(row => { const v = row[c]; if (v && labels[labels.length - 1] !== v) labels.push(v); });
      path.push(labels.join('>'));
    }
    const dimCols = [], measure = [];
    const seen = {};
    for (let c = schoolCol + 1; c < width; c++) {
      if (!path[c]) continue;
      if (DIM_LABELS.includes(path[c])) { dimCols.push(c); continue; }
      let p = path[c];
      if (seen[p]) { seen[p]++; p = p + '#' + seen[p]; } else seen[p] = 1;
      measure.push({ c, path: p });
    }
    const headless = [];
    for (let c = schoolCol + 1; c < width; c++) if (!path[c]) headless.push(c);
    res.cols = measure.map(m => m.path);

    // 데이터 행
    const keySeen = {}, dups = [], yearsSet = new Set(), orphan = [];
    let textCells = 0;
    for (let r = first; r < aoa.length; r++) {
      const row = aoa[r];
      if (!row || row[0] == null) continue;
      const m = yearRe.exec(String(row[0]));
      if (!m) continue;
      const school = String(row[schoolCol] == null ? '' : row[schoolCol]).trim();
      if (!school) continue;
      const year = Number(m[1]);
      const parts = [];
      const hb = /(상반기|하반기)/.exec(String(row[0]));
      if (hb) parts.push(hb[1]);
      dimCols.forEach(c => parts.push(String(row[c] == null ? '' : row[c]).trim()));
      const dim = parts.join('|');
      const key = year + '|' + dim + '|' + school;
      let replaceAt = -1;
      if (keySeen[key]) {
        dups.push(`${school} ${year}${dim ? ' ' + dim : ''} (엑셀 ${keySeen[key].xl}행, ${r + 1}행)`);
        if (opts.dup === 'first') continue;
        if (opts.dup === 'last') replaceAt = keySeen[key].idx;
      }
      const vals = measure.map(mm => {
        const n = toNum(row[mm.c]);
        if (Number.isNaN(n)) { textCells++; return null; }
        return n;
      });
      headless.forEach(c => { if (row[c] != null && String(row[c]).trim() !== '') orphan.push(`${school} ${year} (엑셀 ${r + 1}행)`); });
      if (vals.every(v => v == null)) continue;
      if (replaceAt >= 0) { res.rows[replaceAt] = [year, dim, school, vals]; keySeen[key].xl = r + 1; continue; }
      res.rows.push([year, dim, school, vals]);
      keySeen[key] = keySeen[key] || { xl: r + 1, idx: res.rows.length - 1 };
      yearsSet.add(year);
    }
    res.years = [...yearsSet].sort();
    res.nFacts = res.rows.reduce((a, r) => a + r[3].filter(v => v != null).length, 0);
    res.dupInfo = dups;
    if (dups.length && (opts.dup === 'first' || opts.dup === 'last')) res.warnings.push('중복 행을 ' + (opts.dup === 'first' ? '먼저 나온 행' : '나중에 나온 행') + '으로 선택했습니다: ' + dups.join(', '));
    else if (dups.length) { res.ok = false; res.errors.push('같은 학교·연도 행이 중복되었습니다: ' + dups.join(', ') + ' → 엑셀에서 중복 행을 정리한 뒤 다시 올려주세요.'); }
    const orphanRows = [...new Set(orphan)];
    if (orphanRows.length) res.warnings.push('헤더가 없는 열에 값이 있는 행: ' + orphanRows.join(', ') + ' (다른 표를 붙여넣은 오류일 수 있으니 원본을 확인하세요. 해당 값은 저장되지 않습니다.)');
    if (textCells) res.warnings.push(`숫자가 아닌 문자 값 ${textCells}개는 건너뛰었습니다.`);
    return res;
  }

  /* ── 지표 매핑 검증 (업로드 시) ── */
  function checkCatalog(sheetRes, catalog) {
    const fails = [];
    catalog.forEach(ind => {
      String(ind.patterns).split('||').forEach(alt => alt.split('&&').forEach(part => {
        const p = parsePart(part);
        if (p.sheet !== sheetRes.name || p.optional) return;
        const m = matchPaths(sheetRes.cols.map(norm), p.path);
        if (m.ambiguous) fails.push(`'${ind.name}': 헤더 '${p.path}'가 여러 열과 겹칩니다`);
        else if (!m.idx.length) fails.push(`'${ind.name}': 헤더 '${p.path}'를 찾지 못했습니다`);
      }));
    });
    return fails;
  }

  function parseWorkbook(XLSX, wb, catalog, dupModes) {
    dupModes = dupModes || {};
    const out = { sheets: [], schools: [] };
    wb.SheetNames.forEach(name => {
      const ws = wb.Sheets[name];
      const ref = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s: { r: 0, c: 0 }, e: { r: 0, c: 0 } };
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
      const merges = (ws['!merges'] || []).map(m => ({ s: { r: m.s.r - ref.s.r, c: m.s.c - ref.s.c }, e: { r: m.e.r - ref.s.r, c: m.e.c - ref.s.c } }));
      if (aoa.length && norm(aoa[0][0]) === SCHOOL_SHEET_MARK) {
        out.schools = aoa.slice(1).filter(r => r[1]).map(r => ({ code: r[0], name: String(r[1]).trim(), kind: r[2] || '', type: r[3] || '', region: r[4] || '' }));
        return;
      }
      const r = parseSheet(name, aoa, merges, { dup: dupModes[name] });
      r.src = { aoa, merges };
      if (r.ok && catalog) {
        const fails = checkCatalog(r, catalog);
        if (fails.length) { r.ok = false; r.errors.push('지표 매핑 실패(대학알리미 헤더 문구 변경 의심): ' + fails.join(' / ') + ' → 구글 시트 catalog 탭의 patterns를 새 헤더 문구로 수정한 뒤 다시 올려주세요.'); }
      }
      out.sheets.push(r);
    });
    const known = new Set(out.schools.map(s => s.name));
    if (known.size) out.sheets.forEach(s => {
      const unk = [...new Set(s.rows.map(r => r[2]).filter(n => !known.has(n)))];
      if (unk.length) {
        s.rows = s.rows.filter(r => known.has(r[2]));
        s.nFacts = s.rows.reduce((a, r) => a + r[3].filter(v => v != null).length, 0);
        s.warnings.push('학교 목록(경쟁대학_코드_및_기본정보)에 없는 학교는 제외했습니다: ' + unk.join(', '));
      }
    });
    return out;
  }

  /* 파싱 결과 → DB 형태 (체험 모드·테스트용; 실제 저장은 Code.gs가 동일 규칙으로 수행) */
  function buildDb(parsed, only) {
    const columns = [], idOf = {}, facts = [];
    parsed.sheets.forEach(s => {
      if (!s.ok || (only && !only.includes(s.name))) return;
      const ids = s.cols.map(p => {
        const k = s.name + '|' + p;
        if (!(k in idOf)) { idOf[k] = columns.length + 1; columns.push([columns.length + 1, s.name, p]); }
        return idOf[k];
      });
      s.rows.forEach(r => r[3].forEach((v, i) => { if (v != null) facts.push([r[0], r[1], r[2], ids[i], v]); }));
    });
    return { columns, facts, schools: parsed.schools };
  }

  /* ── 지표 해석기 (DB → 값) ── */
  function Model(db, catalog, own) {
    this.own = own;
    this.catalog = catalog;
    this.byCode = {};
    catalog.forEach(c => { this.byCode[c.code] = c; });
    this.cols = {};                       // sheet -> [{id,path(norm)}]
    (db.columns || []).forEach(c => { (this.cols[c[1]] = this.cols[c[1]] || []).push({ id: c[0], path: norm(c[2]) }); });
    this.vals = {};                       // colId -> {year|dim|school: v}
    this.schools = new Set();
    (db.facts || []).forEach(f => {
      const m = this.vals[f[3]] || (this.vals[f[3]] = {});
      m[f[0] + '|' + f[1] + '|' + f[2]] = f[4];
      this.schools.add(f[2]);
    });
    this._res = {}; this._memo = {}; this._years = {};
  }
  Model.prototype.resolve = function (code) {
    if (this._res[code]) return this._res[code];
    const ind = this.byCode[code];
    const alts = [];
    const issues = [];
    String(ind.patterns).split('||').forEach(alt => {
      const ids = [];
      alt.split('&&').forEach(part => {
        const p = parsePart(part);
        const list = this.cols[p.sheet] || [];
        const m = matchPaths(list.map(x => x.path), p.path);
        if (m.ambiguous) issues.push(`모호한 헤더: ${p.sheet}::${p.path}`);
        else if (!m.idx.length) { if (!p.optional) issues.push(`헤더 없음: ${p.sheet}::${p.path}`); }
        m.idx.forEach(i => ids.push(list[i].id));
      });
      alts.push(ids);
    });
    return (this._res[code] = { alts, issues });
  };
  Model.prototype.get = function (code, year, school) {
    school = school || this.own;
    const k = code + '|' + year + '|' + school;
    if (k in this._memo) return this._memo[k];
    const ind = this.byCode[code];
    let out = null;
    if (ind) {
      const key = year + '|' + (ind.dim || '') + '|' + school;
      const { alts } = this.resolve(code);
      for (const ids of alts) {
        let s = 0, any = false;
        ids.forEach(id => { const m = this.vals[id]; if (m && m[key] != null) { s += m[key]; any = true; } });
        if (any) { out = s; break; }
      }
      if (out != null) {
        out = out / (Number(ind.divisor) || 1);
        if (ind.per) {
          const den = this.get(ind.per, year, school);
          out = (den == null || den === 0) ? null : out / den;
        }
        if (out != null) out = out * (Number(ind.mult) || 1);
      }
    }
    return (this._memo[k] = out);
  };
  Model.prototype.years = function (code) {
    if (this._years[code]) return this._years[code];
    const ind = this.byCode[code]; const ys = new Set();
    if (ind) this.resolve(code).alts.forEach(ids => ids.forEach(id => {
      const m = this.vals[id] || {};
      Object.keys(m).forEach(k => { const p = k.split('|'); if (p[1] === (ind.dim || '')) ys.add(Number(p[0])); });
    }));
    return (this._years[code] = [...ys].sort());
  };
  Model.prototype.compare = function (code, year, schoolSet) {
    const list = [...(schoolSet || this.schools)].filter(s => s !== this.own);
    const vs = list.map(s => ({ s, v: this.get(code, year, s) })).filter(x => x.v != null);
    const avg = vs.length ? vs.reduce((a, x) => a + x.v, 0) / vs.length : null;
    const own = this.get(code, year, this.own);
    let rank = null, total = null;
    if (own != null) {
      const ind = this.byCode[code];
      const all = vs.map(x => x.v).concat([own]);
      total = all.length;
      rank = 1 + all.filter(v => ind.lower == 1 ? v < own : v > own).length;
    }
    return { own, avg, n: vs.length, rank, total, list: vs };
  };
  Model.prototype.problems = function () {
    const out = [];
    this.catalog.forEach(ind => { const r = this.resolve(ind.code); if (r.issues.length) out.push({ code: ind.code, name: ind.name, issues: r.issues }); });
    return out;
  };

  const API = { buildDb, norm, toNum, parseSheet, parseWorkbook, checkCatalog, matchPaths, parsePart, Model };
  if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.CORE = API;
})(typeof window !== 'undefined' ? window : globalThis);

const COLORS = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
const GRAY = '#8b8f98';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = { base: {columns:[],facts:[],schools:[]}, db: null, catalog: DEFAULT_CATALOG, model: null, year: null, tab: '종합', sub: '수입',
            cmpSet: new Set(), cmpCode: 'new_rate', auth: {token:null,email:'',admin:false}, preview: false, log: [], updated: '', loadErr: '', loading: true };
let charts = {};
const DEC = {'%':1,'명':0,'명/인':2,'건':4,'억원':2,'만원':1,'천원':1,'백만원':1,'원':0,':1':1};
function fmt(v, unit) {
  if (v == null || Number.isNaN(v)) return '—';
  const d = unit in DEC ? DEC[unit] : 1;
  return Number(v).toLocaleString('ko-KR', {minimumFractionDigits: d, maximumFractionDigits: d});
}
const ind = c => S.model.byCode[c] || {code:c, name:c, unit:'', lower:0};
const val = (c, y, s) => S.model.get(c, y == null ? S.year : y, s);
const avg = (c, y) => S.model.compare(c, y, S.cmpSet).avg;
function setDb(db) {
  S.db = db;
  S.model = new CORE.Model(db, S.catalog, CFG.OWN);
  const all = schoolNames();
  S.cmpSet = new Set(all.filter(s => s !== CFG.OWN));
  const ys = allYears();
  if (!ys.length) { S.year = null; return; }
  if (!S.year || !ys.includes(S.year)) {
    const core = ['stu_n','new_rate','emp_rate','fac_sec_stu','spf_stu','drop_rate','for_n','res_dom'];
    const need = Math.ceil(core.length / 2);
    const good = ys.filter(y => core.filter(c => val(c, y) != null).length >= need);
    S.year = good.length ? good[good.length - 1] : ys[ys.length - 1];
  }
}
function schoolNames() { return (S.db.schools && S.db.schools.length) ? S.db.schools.map(s => s.name) : [...S.model.schools]; }
function allYears() {
  if (!S.model) return [];
  const set = new Set();
  S.catalog.filter(c => c.tab && c.tab[0] !== '_').forEach(c => S.model.years(c.code).forEach(y => set.add(y)));
  return [...set].sort();
}

function yearsWith(fns) {
  const ys = allYears(), ok = ys.filter(y => fns.some(f => f(y) != null));
  if (!ok.length) return null;
  return ys.filter(y => y >= ok[0] && y <= ok[ok.length - 1]);

const tipUnit = (unit) => ({callbacks: {label: c => { const u = c.dataset.unit || unit, v = c.chart.options.indexAxis === 'y' ? c.parsed.x : c.parsed.y; return ` ${c.dataset.label}: ${fmt(v, u)}${u === '%' ? '%' : u ? ' ' + u : ''}`; }}});
function yAxis(unit, o) { return Object.assign({grid:{color:'#edf0f5'}, border:{display:false}, title:{display:!!unit, text:unit, color:'#8a93a3'}, ticks:{callback: v => v.toLocaleString('ko-KR')}}, o || {}); }
function drawLine(id, series, unit, o) {
  o = o || {};
  const ys = yearsWith(series.map(s => s.fn)); if (!ys) return emptyCv(id);
  charts[id] = new Chart(document.getElementById(id), {type:'line',
    data:{labels: ys.map(y => y + '년'), datasets: series.map(s => ({label:s.label, data: ys.map(y => s.fn(y)), borderColor:s.color, backgroundColor:s.color, borderDash:s.dash || [], borderWidth:s.dash ? 1.8 : 2.6, pointRadius:s.dash ? 3 : 4.5, pointHoverRadius:7, pointBorderColor:'#fff', pointBorderWidth:1.5, tension:0, spanGaps:false, unit:s.unit || unit}))},

function prevYear(code, y) { const ys = S.model.years(code).filter(v => v < y && val(code, v) != null); return ys.length ? ys[ys.length - 1] : null; }
function kpi(code, color, label) {
  const i = ind(code), v = val(code), c = color || 'var(--s1)';
  const name = esc(label || i.name);
  if (v == null) return `<div class="kpi" style="--c:${c}"><div class="l">${name}</div><div class="v na">자료없음</div><div class="n">${S.year}년 자료가 DB에 없습니다</div></div>`;
  let d = '', cls = '';
  const py = prevYear(code, S.year);
  if (py != null) {
    const pv = val(code, py), diff = v - pv;
    const pct = pv ? diff / Math.abs(pv) * 100 : null;
    const sign = diff > 0 ? '▲' : diff < 0 ? '▼' : '–';
    const txt = i.unit === '%' ? `${fmt(Math.abs(diff), '%')}%p` : `${fmt(Math.abs(diff), i.unit)}${pct != null && Math.abs(diff) > 0 ? ` (${Math.abs(pct).toFixed(1)}%)` : ''}`;
    if (Number(i.lower) !== 2 && diff !== 0) cls = (diff > 0) === (Number(i.lower) !== 1) ? 'good' : 'bad';
    d = `${sign} ${txt} <span style="font-weight:500;color:var(--ink3)">vs ${py}년</span>`;
  } else d = '<span style="font-weight:500;color:var(--ink3)">비교할 이전 연도 자료 없음</span>';
  return `<div class="kpi" style="--c:${c}"><div class="l">${name}</div><div class="v">${fmt(v, i.unit)}<span class="u">${esc(i.unit)}</span></div><div class="d ${cls}">${d}</div>${i.note ? `<div class="n">※ ${esc(i.note)}</div>` : ''}</div>`;
}
function kpis(list) { (S._kc = S._kc || []).push(...list.map(x => x[0])); return `<div class="kpis">${list.map((x, i) => kpi(x[0], COLORS[i % 8], x[1])).join('')}</div>`; }
function card(id, title, sub, o) { o = o || {}; return `<section class="card ${o.wide ? 'wide' : ''}"><h3>${esc(title)}</h3><p class="sub">${esc(sub || '')}</p><div class="cv ${o.h || ''}"><canvas id="${id}"></canvas></div>${o.note ? `<p class="leg-note">${o.note}</p>` : ''}</section>`;
}
function yearTable(title, cols) {
  const ys = (yearsWith(cols.map(c => y => val(c[0], y))) || []).slice().reverse();
  if (!ys.length) return '';
  const head = cols.map(c => `<th>${esc(c[1] || ind(c[0]).name)}<br><span style="font-weight:400;color:var(--ink3)">${esc(ind(c[0]).unit)}</span></th>`).join('');
  const rows = ys.map(y => `<tr class="${y === S.year ? 'sel' : ''}"><td>${y}년</td>${cols.map(c => { const v = val(c[0], y); return v == null ? '<td class="na">—</td>' : `<td>${fmt(v, ind(c[0]).unit)}</td>`; }).join('')}</tr>`).join('');
  return `<section class="card wide" style="margin-top:16px"><h3>${esc(title)}</h3><p class="sub">선택한 기준 연도 행이 강조됩니다. — 는 해당 연도 자료 없음 (다른 연도 값으로 대체하지 않음)</p><div class="tw"><table><thead><tr><th>연도</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
const L = (c, label, color, o) => Object.assign({label: label || ind(c).name, fn: y => val(c, y), color}, o);
const A = (c, label, color) => ({label: label || ind(c).name + ' (비교대학 평균)', fn: y => avg(c, y), color, dash: [6, 4]});

const KEY_CODES = ['new_rate','stu_rate','emp_rate','keep1','drop_rate','fac_sec_stu','spf_stu','res_dom','for_n','inc_tuition','exp_pay','sch_pp'];
let U = null;   // 업로드 작업 상태
function mergeDb(base, parsed, sel) {   // sel: Map(sheet -> Set(years))
  const columns = base.columns.map(c => c.slice()), idOf = {}, sheetOf = {};
  let maxId = 0;
  columns.forEach(c => { idOf[c[1] + '|' + c[2]] = c[0]; sheetOf[c[0]] = c[1]; maxId = Math.max(maxId, c[0]); });
  const ids = {};
  sel.forEach((ys, name) => {
    const s = parsed.sheets.find(x => x.name === name);
    ids[name] = s.cols.map(p => { const k = name + '|' + p; if (!(k in idOf)) { idOf[k] = ++maxId; columns.push([maxId, name, p]); sheetOf[maxId] = name; } return idOf[k]; });
  });
  const facts = base.facts.filter(f => { const ys = sel.get(sheetOf[f[3]]); return !(ys && ys.has(f[0])); });
  sel.forEach((ys, name) => {
    const s = parsed.sheets.find(x => x.name === name);
    s.rows.forEach(r => { if (!ys.has(r[0])) return; r[3].forEach((v, i) => { if (v != null) facts.push([r[0], r[1], r[2], ids[name][i], v]); }); });
  });
  return {columns, facts, schools: parsed.schools.length ? parsed.schools : base.schools};
}
function diffSheet(s) {   // DB 대비 신규/변경/동일 건수 (연도별)
  const sheetCols = {}; S.base.columns.forEach(c => { if (c[1] === s.name) sheetCols[c[2]] = c[0]; });
  const cur = {}; S.base.facts.forEach(f => { cur[f[3] + '|' + f[0] + '|' + f[1] + '|' + f[2]] = f[4]; });
  const per = {};
  s.rows.forEach(r => {
    const o = per[r[0]] || (per[r[0]] = {n: 0, ch: 0, same: 0});
    r[3].forEach((v, i) => {
      if (v == null) return;
      const id = sheetCols[s.cols[i]];
      const old = id == null ? undefined : cur[id + '|' + r[0] + '|' + r[1] + '|' + r[2]];
      if (old === undefined) o.n++; else if (Math.abs(old - v) > 1e-9 * Math.max(1, Math.abs(v))) o.ch++; else o.same++;
    });
  });
  return per;
}

    } catch (e) { $('#upRes').innerHTML = `<div class="banner err">엑셀을 읽지 못했습니다: ${esc(e.message)}</div>`; }
  };
  rd.readAsArrayBuffer(f);
}
function reparse() {
  U.parsed = CORE.parseWorkbook(XLSX, U.wb, S.catalog, U.dup);
  U.diff = {};
  U.parsed.sheets.forEach(s => { U.diff[s.name] = s.ok ? diffSheet(s) : {}; });
  if (!U.sel) {   // 기본 선택: 오류 없는 시트 중 신규/변경이 있는 시트·연도
    U.sel = new Map();
    U.parsed.sheets.forEach(s => {
      if (!s.ok) return;
      const ys = new Set(Object.entries(U.diff[s.name]).filter(([y, o]) => o.n + o.ch > 0).map(([y]) => Number(y)));
      if (ys.size) U.sel.set(s.name, ys);
    });
  } else {   // 재분석 시 선택 정리
    [...U.sel.keys()].forEach(n => { const s = U.parsed.sheets.find(x => x.name === n); if (!s || !s.ok) U.sel.delete(n); });
  }
}
function renderUpload() {
  const P = U.parsed;
  const rows = P.sheets.map(s => {
    const on = U.sel.has(s.name);
    const yrs = s.years.map(y => {
      const o = (U.diff[s.name] || {})[y] || {n: 0, ch: 0, same: 0};

      const tag = s.ok ? (o.n + o.ch === 0 ? '<span style="color:var(--ink3)">동일</span>' : `${o.n ? `<b style="color:var(--s1)">신규 ${o.n}</b>` : ''}${o.n && o.ch ? ' · ' : ''}${o.ch ? `<b style="color:var(--s2)">변경 ${o.ch}</b>` : ''}`) : '';
      return `<label style="display:inline-flex;gap:5px;align-items:center;margin:2px 10px 2px 0;white-space:nowrap"><input type="checkbox" data-y="${esc(s.name)}|${y}" ${checked ? 'checked' : ''} ${s.ok ? '' : 'disabled'}>${y}년 ${tag}</label>`;
    }).join('');
    const msgs = s.errors.map(m => `<div class="msg e">✕ ${esc(m)}</div>`).join('') + s.warnings.map(m => `<div class="msg w">⚠ ${esc(m)}</div>`).join('');
    const dupSel = (s.dupInfo && s.dupInfo.length) ? `<div class="msg">중복 행 처리: <select data-dup="${esc(s.name)}"><option value="">선택하세요</option><option value="first" ${U.dup[s.name] === 'first' ? 'selected' : ''}>먼저 나온 행 사용</option><option value="last" ${U.dup[s.name] === 'last' ? 'selected' : ''}>나중에 나온 행 사용</option></select></div>` : '';
    const st = !s.ok ? '<span class="st bad">저장 불가</span>' : s.warnings.length ? '<span class="st warn">확인 필요</span>' : '<span class="st ok">정상</span>';
    return `<tr><td style="white-space:normal;max-width:240px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-sheet="${esc(s.name)}" ${on ? 'checked' : ''} ${s.ok ? '' : 'disabled'}>${esc(s.name)}</label></td><td>${st}</td><td>${s.rows.length}행 · ${s.nFacts.toLocaleString()}건</td><td style="text-align:left;white-space:normal">${yrs}${msgs}${dupSel}</td></tr>`;
  }).join('');
  // 검토 필요: 급변 값
  const rev = reviewList();
  const nSel = U.sel.size, nFacts = [...U.sel.entries()].reduce((a, [n, ys]) => a + U.parsed.sheets.find(s => s.name === n).rows.filter(r => ys.has(r[0])).reduce((b, r) => b + r[3].filter(v => v != null).length, 0), 0);
  $('#upRes').innerHTML = `<h2 class="sec">2. 분석 결과 <small>${esc(U.file)} · 학교 ${P.schools.length}개교 · 시트 ${P.sheets.length}개</small></h2>
    <section class="card"><div class="tw"><table><thead><tr><th>시트</th><th>상태</th><th>규모</th><th style="text-align:left">연도별 변경 (체크한 연도만 저장 · 해당 시트·연도의 기존 값은 교체됩니다)</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    ${rev}
    <h2 class="sec">3. 저장</h2><section class="card"><p style="margin-bottom:12px"><b>${nSel}개 시트 · ${nFacts.toLocaleString()}건</b>을 저장합니다. 오류가 있는 시트는 저장되지 않으며, 나머지 시트는 정상 저장됩니다.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" id="saveBtn" ${nSel && CFG.API_URL ? '' : 'disabled'}>DB에 저장</button><button class="btn ghost" id="prevBtn" ${nSel ? '' : 'disabled'}>저장하지 않고 이 화면에서 미리보기</button><span id="saveMsg" class="msg"></span></div>
      ${CFG.API_URL ? '' : '<p class="leg-note">※ DB가 연결되지 않아 저장 버튼은 비활성입니다.</p>'}</section>`;
  $('#upRes').querySelectorAll('input[data-sheet]').forEach(el => el.onchange = () => {
    const n = el.dataset.sheet;
    if (el.checked) { const s = P.sheets.find(x => x.name === n); U.sel.set(n, new Set(s.years)); } else U.sel.delete(n);
    renderUpload();
  });
  $('#upRes').querySelectorAll('input[data-y]').forEach(el => el.onchange = () => {
    const [n, y] = el.dataset.y.split('|'); const set = U.sel.get(n) || new Set();
    el.checked ? set.add(Number(y)) : set.delete(Number(y));
    set.size ? U.sel.set(n, set) : U.sel.delete(n);
    renderUpload();
  });
  $('#upRes').querySelectorAll('select[data-dup]').forEach(el => el.onchange = () => { U.dup[el.dataset.dup] = el.value; U.sel = null; reparse(); renderUpload(); });
  $('#saveBtn').onclick = saveUpload;
  $('#prevBtn').onclick = () => { S.preview = true; setDb(mergeDb(S.base, U.parsed, U.sel)); S.tab = '종합'; draw(); };
}
function reviewList() {
  if (!U.sel.size) return '';
  const merged = mergeDb(S.base, U.parsed, U.sel), M2 = new CORE.Model(merged, S.catalog, CFG.OWN), M1 = S.model;
  const out = [];
  const ys = new Set(); U.sel.forEach(set => set.forEach(y => ys.add(y)));
  KEY_CODES.forEach(c => {
    const i = M2.byCode[c]; if (!i) return;
    [...ys].sort().forEach(y => {
      const nv = M2.get(c, y), ov = S.base.facts.length ? (S.preview ? null : M1.get(c, y)) : null;
      if (ov != null && nv != null && Math.abs(nv - ov) > 1e-9 && Math.abs(nv - ov) / Math.max(Math.abs(ov), 1e-9) > 0.1) out.push(`<tr><td>${esc(i.name)}</td><td>${y}년</td><td>기존 값 ${fmt(ov, i.unit)} → 새 값 <b>${fmt(nv, i.unit)}</b> ${esc(i.unit)}</td><td style="text-align:left">기존 값이 10% 넘게 바뀝니다</td></tr>`);
      const pv = M2.get(c, y - 1);
      if (nv != null && pv != null && pv !== 0 && Math.abs(nv - pv) / Math.abs(pv) > 0.4) out.push(`<tr><td>${esc(i.name)}</td><td>${y}년</td><td>${y - 1}년 ${fmt(pv, i.unit)} → ${y}년 <b>${fmt(nv, i.unit)}</b> ${esc(i.unit)}</td><td style="text-align:left">전년 대비 40% 넘게 변동</td></tr>`);
    });
  });
  if (!out.length) return `<section class="card" style="margin-top:14px"><h3>검토 필요 항목</h3><p class="sub">본교 핵심 지표 ${KEY_CODES.length}개에서 급변 값이 발견되지 않았습니다.</p></section>`;
  return `<section class="card" style="margin-top:14px"><h3>검토 필요 항목 (본교 핵심 지표)</h3><p class="sub">입력 오류(자릿수·열 밀림)일 수 있으니 원본과 대조한 뒤 저장하세요. 실제 변동이면 그대로 저장해도 됩니다.</p><div class="tw"><table><thead><tr><th>지표</th><th>연도</th><th style="text-align:left">값</th><th style="text-align:left">사유</th></tr></thead><tbody>${out.join('')}</tbody></table></div></section>`;
}
async function saveUpload() {
  const msg = $('#saveMsg'), btn = $('#saveBtn');
  if (!tokenValid()) { msg.className = 'msg e'; msg.textContent = '로그인이 만료되었습니다. 다시 로그인해 주세요.'; S.auth.admin = false; draw(); return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '저장 중… (창을 닫지 마세요)';
  try {
    if (U.parsed.schools.length) { const r = await api({action: 'saveSchools', schools: U.parsed.schools}); if (!r.ok) throw new Error(r.error); }
    const items = [...U.sel.entries()].map(([name, ys]) => {
      const s = U.parsed.sheets.find(x => x.name === name);
      return {sheet: name, years: [...ys].sort(), cols: s.cols, rows: s.rows.filter(r => ys.has(r[0]))};
    });
    let batch = [], size = 0, done = 0;
    const flush = async () => {
      if (!batch.length) return;
      const r = await api({action: 'saveBatch', file: U.file, sheets: batch});
      if (!r.ok) throw new Error(r.error);
      done += batch.length; msg.textContent = `저장 중… ${done}/${items.length}개 시트`; batch = []; size = 0;
    };
    for (const it of items) { const sz = JSON.stringify(it).length; if (size + sz > 1500000) await flush(); batch.push(it); size += sz; }
    await flush();
    msg.className = 'msg'; msg.textContent = '저장 완료. 최신 데이터를 다시 불러오는 중…';
    await loadData(true);
    U = null; S.preview = false; S.tab = '종합'; draw();
    toast('저장이 완료되었습니다. 대시보드가 최신 데이터로 갱신되었습니다.');
  } catch (e) { msg.className = 'msg e'; msg.textContent = '저장 실패: ' + e.message + ' (이미 저장된 시트는 유지됩니다. 같은 파일을 다시 올려 이어서 저장하세요.)'; btn.disabled = false; }
}

function exportDb() {
  const colOf = {}; S.base.columns.forEach(c => colOf[c[0]] = c);

/* ═════════════════ 인증 (구글 로그인) ═════════════════ */
function jwt(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; } }
function tokenValid() { const p = S.auth.token && jwt(S.auth.token); return !!(p && p.exp * 1000 > Date.now() + 30000); }
async function api(body) {
  const r = await fetch(CFG.API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({token: S.auth.token}, body))});
  return r.json();
}
function initGsi() {
  if (!CFG.CLIENT_ID || !window.google || !google.accounts) return;
  google.accounts.id.initialize({client_id: CFG.CLIENT_ID, callback: onCred, auto_select: false});
  renderGsiButton();
}
function renderGsiButton() { const el = document.getElementById('gbtn'); if (el && window.google && google.accounts && CFG.CLIENT_ID) google.accounts.id.renderButton(el, {theme: 'outline', size: 'large', locale: 'ko'}); }
async function onCred(resp) {
  S.auth.token = resp.credential;
  try { sessionStorage.setItem('idtok', resp.credential); } catch (e) {}
  await checkAdmin();
}
async function checkAdmin() {
  try {
    const r = await api({action: 'whoami'});
    S.auth.email = r.email || ''; S.auth.admin = !!(r.ok && r.admin);
    if (!r.ok) { S.auth.token = null; toast(r.error || '로그인 확인 실패'); }
  } catch (e) { toast('서버에 연결하지 못했습니다.'); }
  renderTabs(); if (S.tab === '데이터 관리') draw();
}

}
function renderYear() {

function toast(t) { const d = document.createElement('div'); d.className = 'banner info'; d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:92vw'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4500); }
function emptyState() {
  return `<section class="card" style="max-width:760px;margin:30px auto;text-align:center;padding:36px 28px"><h3 style="font-size:20px">표시할 공시 데이터가 없습니다</h3>
   <p style="margin:12px 0 18px;color:var(--ink2)">${S.loadErr ? '<span style="color:var(--bad)">' + esc(S.loadErr) + '</span><br>' : ''}${CFG.API_URL ? 'DB가 비어 있습니다. IR센터 계정으로 로그인해 대학알리미 엑셀을 업로드하세요.' : 'DB(API_URL)가 아직 연결되지 않았습니다. 엑셀 파일로 먼저 화면을 확인할 수 있습니다.'}</p>
   <button class="btn" id="goAdmin">${CFG.API_URL ? 'IR센터 로그인 / 업로드' : '엑셀로 미리보기'}</button></section>`;
}
function draw() {
  killCharts(); renderTabs(); renderYear();
  const v = $('#view');
  const hasData = S.model && allYears().length;
  let banner = '';
  if (S.preview) banner = `<div class="banner warn"><b>미리보기 중입니다.</b> 아직 DB에 저장되지 않은 엑셀 내용이 표시되고 있습니다.<button class="btn ghost sm" id="endPrev">원래 화면으로</button></div>`;
  if (S.loading) { v.innerHTML = '<div class="banner info">데이터를 불러오는 중입니다…</div>'; return; }
  if (S.tab === '데이터 관리') {
    const r = startAdmin(); v.innerHTML = banner + r.html; r.post.forEach(f => f()); return;
  }
  if (!hasData) { v.innerHTML = banner + emptyState(); return; }
  S._kc = [];
  const r = VIEWS[S.tab]();
  if (S._kc.length && S._kc.every(c => val(c) == null)) {   // 선택 연도에 이 탭 자료가 전혀 없을 때 안내 (값을 대체하지는 않음)
    const ys = allYears().filter(y => S._kc.some(c => val(c, y) != null));
    if (ys.length) banner += `<div class="banner info"><b>${S.year}년 ${S.tab} 자료가 아직 DB에 없습니다.</b> 이 탭의 가장 최근 자료는 ${ys[ys.length - 1]}년입니다.<button class="btn ghost sm" data-year="${ys[ys.length - 1]}">${ys[ys.length - 1]}년 보기</button></div>`;
  }
  v.innerHTML = banner + r.html;
  r.post.forEach(f => f());
}
async function loadData(quiet) {
  if (!CFG.API_URL) { S.loading = false; S.catalog = DEFAULT_CATALOG; setDb({columns: [], facts: [], schools: []}); S.base = S.db; return; }
  try {
    const r = await fetch(CFG.API_URL + '?action=data');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '응답 오류');
    S.catalog = (d.catalog && d.catalog.length) ? d.catalog : DEFAULT_CATALOG;
    S.catalog.forEach(c => { c.lower = Number(c.lower) || 0; });
    S.base = {columns: d.columns, facts: d.facts, schools: d.schools};
    S.log = d.log || []; S.updated = d.updated || ''; S.loadErr = '';
    S.preview = false;
    setDb(S.base);
    $('#upd').textContent = S.updated ? '데이터 갱신: ' + S.updated : '';
  } catch (e) {
    S.loadErr = '데이터를 불러오지 못했습니다: ' + e.message;
    S.catalog = DEFAULT_CATALOG; S.base = {columns: [], facts: [], schools: []}; setDb(S.base);
  }
  S.loading = false;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-year],[data-sub],[data-school],[data-cmp],#goAdmin,#endPrev,#loginLink');
  if (!t) return;
  if (t.id === 'loginLink') { e.preventDefault(); S.tab = '데이터 관리'; draw(); return; }
  if (t.id === 'goAdmin') { S.tab = '데이터 관리'; draw(); return; }
  if (t.id === 'endPrev') { S.preview = false; setDb(S.base); draw(); return; }
  if (t.dataset.year) { S.year = Number(t.dataset.year); draw(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; draw(); window.scrollTo(0, 0); }
  else if (t.dataset.sub) { S.sub = t.dataset.sub; draw(); }
  else if (t.dataset.school) { const n = t.dataset.school; S.cmpSet.has(n) ? S.cmpSet.delete(n) : S.cmpSet.add(n); S.model._memo = {}; draw(); }
  else if (t.dataset.cmp) { const names = schoolNames().filter(s => s !== CFG.OWN); S.cmpSet = new Set(t.dataset.cmp === 'all' ? names : []); draw(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'yearSel') { S.year = Number(e.target.value); draw(); }
  if (e.target.id === 'cmpSel') { S.cmpCode = e.target.value; draw(); }
});
(async function init() {
  draw();
  await loadData();
  try { const t = sessionStorage.getItem('idtok'); if (t && CFG.API_URL) { S.auth.token = t; if (tokenValid()) await checkAdmin(); else S.auth.token = null; } } catch (e) {}
  draw();
  initGsi();
})();
</script>
</body>
